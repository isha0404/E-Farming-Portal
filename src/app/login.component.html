<div class="auth-container">
  <div class="auth-card">

    <h2>E-Farming Portal 🌾</h2>

    <input 
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
    >

    <input 
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
    >

    <button (click)="login()">Login</button>

    <p>
      New user?
      <a routerLink="/register">Sign Up</a>
    </p>

  </div>
</div>
